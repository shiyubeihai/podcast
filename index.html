<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF6F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="播客台">
<title>播客台</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#FFF6F7; --panel:#FFFFFF; --panel2:#FDEBEF;
  --ink:#3B2B30; --muted:#9A8288; --line:#F2DDE2;
  --accent:#C2607C; --accent-dim:#E3A9B8;
  --accent-soft:#F8E3E8;
  --warn:#C2544C;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",system-ui,sans-serif;
  display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
b{font-weight:600}

.view{display:none;flex:1;min-height:0;flex-direction:column}
.view.on{display:flex}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 24px}

/* 顶栏 */
.top{display:flex;align-items:center;gap:12px;padding:16px 16px 10px}
.top .grow{flex:1;min-width:0}
.brand{font-size:22px;font-weight:700;letter-spacing:.3px}
.sub{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:17px;display:grid;place-items:center;flex:0 0 auto}
.icon-btn:active{background:var(--panel2)}
.icon-btn.on{background:var(--accent-soft);border-color:var(--accent-dim);color:var(--accent)}
.icon-btn.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 搜索 */
.searchbar{display:flex;gap:8px;align-items:center;padding:0 16px 8px}
.searchbar input{flex:1;min-width:0;padding:10px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);font-size:15px;outline:none;font-family:inherit;
  -webkit-appearance:none;appearance:none}
.searchbar input:focus{border-color:var(--accent-dim)}
.searchbar input::-webkit-search-cancel-button{display:none}
.searchbar .cancel{flex:0 0 auto;font-size:13px;color:var(--muted);padding:8px 2px}

/* 专辑筛选 */
.filters{display:flex;gap:8px;padding:0 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .f{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1px solid var(--line);
  background:var(--panel);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:12px;min-height:30px}
.filters .f.on{color:var(--ink);background:var(--panel2)}
.filters .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:block}

/* 分组 */
.group{font-size:12px;color:var(--muted);padding:16px 4px 6px;letter-spacing:.5px;display:flex;align-items:center;gap:7px}
.group i{width:7px;height:7px;border-radius:50%;display:block}
.group:first-child{padding-top:4px}

/* 曲目卡 */
.item{display:flex;gap:12px;align-items:center;padding:10px 8px;border-radius:14px}
.item:active{background:var(--panel)}
.cov{width:58px;height:58px;border-radius:12px;flex:0 0 auto;overflow:hidden;position:relative;
     display:grid;place-items:center;font-size:24px;font-weight:700;color:#fff;
     box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.cov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.item .info{flex:1;min-width:0}
.item .info b{display:block;font-size:15px;font-weight:500;line-height:1.35;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item.playing .info b{color:var(--accent)}
.meta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.badge{font-size:11px;color:var(--accent);border:1px solid var(--accent-dim);border-radius:5px;padding:0 4px}
.star{color:#C08A2E;font-size:11px;letter-spacing:-1px;margin-right:5px;font-weight:700;vertical-align:1px}
#pTitle .star{font-size:15px;letter-spacing:-1.5px;margin-right:6px}
.badge.done{color:var(--muted);border-color:var(--line)}
.badge.bad{color:var(--warn);border-color:#5A3428}
.badge.self{color:var(--muted);border-style:dashed;border-color:var(--accent-dim)}
.pbar-mini{height:2px;background:var(--line);border-radius:1px;margin-top:6px;overflow:hidden}
.pbar-mini i{display:block;height:100%;background:var(--accent)}
.item .go{color:var(--muted);font-size:18px;flex:0 0 auto;width:28px;text-align:center}
.item .dl{width:38px;height:38px;display:grid;place-items:center;color:var(--muted);font-size:15px;
  flex:0 0 auto;border-radius:50%;font-variant-numeric:tabular-nums}
.item .dl.on{color:var(--accent)}
.item .dl:active{background:var(--panel2)}

.cachebar{display:flex;gap:10px;align-items:center;padding:14px 2px 4px;margin-top:8px;border-top:1px solid var(--line)}
.cachebar .cacheinfo{flex:1;text-align:center;font-size:12px;color:var(--muted)}
.cachebar .chip{min-height:30px;padding:5px 12px;font-size:12px}

/* 空状态 */
.empty{text-align:center;color:var(--muted);padding:44px 16px;font-size:14px;line-height:1.9}
.empty .big{font-size:34px;margin-bottom:12px}
.empty b{color:var(--ink);display:block;margin-bottom:6px;font-size:15px}
.empty code{background:var(--panel);padding:1px 6px;border-radius:5px;font-size:12px;color:var(--ink)}

/* 播放器 */
#v-player{padding:0 20px 6px}
.pbar{display:flex;align-items:center;gap:8px;padding:6px 0}
.ptag{flex:1;text-align:center;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{width:40px;height:40px;display:grid;place-items:center;font-size:20px;color:var(--muted);flex:0 0 auto}
.artwrap{display:flex;justify-content:center;margin:auto 0 16px}
.art{width:min(72vw,300px);aspect-ratio:1;border-radius:22px;overflow:hidden;position:relative;
     display:grid;place-items:center;font-size:72px;font-weight:700;color:#fff;
     box-shadow:0 14px 34px rgba(120,70,90,.18),inset 0 0 0 1px rgba(255,255,255,.35)}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ptext{text-align:center;margin-bottom:6px}
.ptitle{font-size:19px;font-weight:600;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.psub{font-size:12px;color:var(--muted);margin-top:6px}
.seek{width:100%;appearance:none;-webkit-appearance:none;background:transparent;margin:14px 0 0;height:20px}
.seek::-webkit-slider-runnable-track{height:4px;border-radius:2px;
  background:linear-gradient(90deg,var(--accent) var(--pct,0%),var(--line) var(--pct,0%))}
.seek::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);margin-top:-5px;box-shadow:0 1px 5px rgba(120,70,90,.35)}
.times{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:-2px}
.ctrls{display:flex;align-items:center;justify-content:space-between;margin:8px 0 2px}
.cbtn{width:44px;height:44px;display:grid;place-items:center;font-size:20px}
.cbtn.small{font-size:12px;color:var(--muted)}
.cbtn:active{color:var(--accent)}
.playbtn{width:62px;height:62px;border-radius:50%;background:var(--accent);color:#fff;font-size:22px;display:grid;place-items:center;box-shadow:0 8px 20px rgba(194,96,124,.32)}
.playbtn:active{transform:scale(.96)}
.chips{display:flex;gap:8px;align-items:center;justify-content:center;margin:6px 0 auto;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:6px 14px;font-size:12px;min-height:32px}
.chip.on{color:var(--accent);border-color:var(--accent-dim);background:var(--accent-soft)}
.chip:active{background:var(--panel2)}

/* 迷你条 */
.mini{display:none;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-top:1px solid var(--line)}
.mini.on{display:flex}
.mcover{width:40px;height:40px;border-radius:10px;flex:0 0 auto;overflow:hidden;position:relative;display:grid;place-items:center;font-size:17px;font-weight:700;color:#fff}
.mcover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mini .mt{flex:1;min-width:0}
.mini .mt b{display:block;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mprog{height:2px;background:var(--line);margin-top:7px;border-radius:1px;overflow:hidden}
.mprog i{display:block;height:100%;background:var(--accent);width:0}
.mbtn{width:40px;height:40px;display:grid;place-items:center;font-size:18px}

/* 弹层 */
.sheetback{position:fixed;inset:0;background:rgba(80,45,58,.32);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
.sheetback.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#FFFFFF;border-radius:20px 20px 0 0;
  padding:16px 16px calc(14px + env(safe-area-inset-bottom));transform:translateY(102%);
  transition:transform .22s ease;z-index:41;border-top:1px solid var(--line);max-height:80dvh;overflow-y:auto}
.sheet.on{transform:none}
.sheet h3{margin:2px 0 10px;font-size:13px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .item2{padding:15px 4px;border-bottom:1px solid var(--line);font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet .item2:last-child{border-bottom:0}
.sheet .item2.cancel{color:var(--muted);justify-content:center;font-size:14px}
.sheet .item2 .sub{margin:0;font-size:12px}
.sheet input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);
  color:var(--ink);font-size:16px;margin-bottom:10px;outline:none;font-family:inherit}
.sheet input:focus{border-color:var(--accent-dim)}
.sheet .btn{width:100%;padding:14px;border-radius:12px;background:var(--accent);color:#fff;
  font-size:16px;font-weight:600;margin-top:4px}
.sheet .hint{font-size:12px;color:var(--muted);margin:-2px 0 10px;line-height:1.6}
.sheet .hint code{background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:11px}
.sheet .linkbtn{display:block;color:var(--accent);font-size:14px;text-decoration:underline;text-underline-offset:3px;margin:2px 0 10px}

/* 文稿 */
.sheet .doc{font-size:15.5px;line-height:1.85;padding:2px 0 10px}
.sheet .doc .line{display:flex;gap:10px;margin:0 0 13px}
.sheet .doc .who{flex:0 0 20px;font-size:11px;color:var(--muted);padding-top:5px}
.sheet .doc .who.a{color:var(--accent)}
.sheet .doc .txt{flex:1;min-width:0;word-break:break-word}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,10px);
  background:rgba(255,255,255,.98);border:1px solid var(--line);color:var(--ink);box-shadow:0 10px 30px rgba(120,70,90,.14);padding:10px 16px;border-radius:11px;
  font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:82vw;text-align:center;line-height:1.6}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-height: 640px){
  .art{width:min(56vw,200px);font-size:52px}
  .pbar{padding:2px 0}
}
</style>
</head>
<body>

<!-- ============ 列表 ============ -->
<section id="v-list" class="view on">
  <div class="top">
    <div class="grow">
      <div class="brand">播客台</div>
      <div class="sub" id="sub">加载中…</div>
    </div>
    <button class="icon-btn" id="btnSearch" aria-label="搜索">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.6-3.6"></path></svg>
    </button>
    <button class="icon-btn" id="btnAdd" aria-label="添加链接">＋</button>
    <button class="icon-btn" id="btnRefresh" aria-label="刷新清单">↻</button>
  </div>
  <div class="searchbar" id="searchBar" hidden>
    <input id="searchInput" type="search" placeholder="搜索标题或专辑…" autocomplete="off"
           autocapitalize="off" autocorrect="off" enterkeyhint="search">
    <button class="icon-btn" id="btnSearchClear" aria-label="清空" style="width:32px;height:32px;font-size:14px">×</button>
    <button class="cancel" id="btnSearchCancel">取消</button>
  </div>
  <div class="filters" id="filters"></div>
  <div class="scroll">
    <div id="list"></div>
    <div class="cachebar" id="cacheBar" hidden>
      <button class="chip" id="btnCacheAll">缓存全部</button>
      <span class="cacheinfo" id="cacheInfo">已存 0 集</span>
      <button class="chip" id="btnCacheClear">清理</button>
    </div>
    <div class="empty" id="empty" style="display:none">
      <div class="big">🎧</div>
      <b>还没有播客</b>
      在仓库的 <code>links.txt</code> 里加一行豆包链接<br>
      保存后等一分钟，点右上角 ↻ 刷新
    </div>
  </div>
</section>

<!-- ============ 播放器 ============ -->
<section id="v-player" class="view">
  <div class="pbar">
    <button class="hbtn" id="btnClose" aria-label="收起">⌄</button>
    <div class="ptag" id="pAlbum">播客台</div>
    <button class="hbtn" id="btnMore" aria-label="更多">⋯</button>
  </div>
  <div class="artwrap">
    <div class="art" id="pArt"><img id="pArtImg" alt="" hidden><span id="pArtChar">播</span></div>
  </div>
  <div class="ptext">
    <div class="ptitle" id="pTitle">未在播放</div>
    <div class="psub" id="pSub">从列表里选一集</div>
  </div>
  <input class="seek" id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="播放进度">
  <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
  <div class="ctrls">
    <button class="cbtn" id="btnPrev" aria-label="上一集">⏮</button>
    <button class="cbtn small" id="btnBack15" aria-label="后退15秒">−15</button>
    <button class="playbtn" id="btnPlay" aria-label="播放">▶</button>
    <button class="cbtn small" id="btnFwd15" aria-label="前进15秒">+15</button>
    <button class="cbtn" id="btnNext" aria-label="下一集">⏭</button>
  </div>
  <div class="chips">
    <button class="chip" id="btnRate">1.0×</button>
    <button class="chip" id="btnText" hidden>文稿</button>
    <button class="chip" id="btnSource">原页面</button>
  </div>
</section>

<!-- ============ 迷你条 ============ -->
<div class="mini" id="mini">
  <div class="mcover" id="mCover">播</div>
  <div class="mt" id="mOpen">
    <b id="mTitle">—</b>
    <div class="mprog"><i id="mProg"></i></div>
  </div>
  <button class="mbtn" id="mPlay" aria-label="播放/暂停">▶</button>
</div>

<div class="sheetback" id="sheetBack"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<audio id="au" preload="metadata"></audio>

ow-sign.byteimg.com/tos-cn-i-ik7evvg4ik/rc/deep_research/4e5a85c2b02b47feb5d7f79950f49559?lk3s=8e244e95&rcl=202611281323366FD5914C647AD9F4B36C&rrcfp=bfce7eaa&x-expires=1796448217&x-signature=7w2JOhRtA9%2BvLBlrV6C%2FIPZFb2k%3D","cover":"https://p6-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/rc/deep_research/ef205599ba9f43aeb307423020b67747~tplv-a9rns2rl98-24:1280:720.image?lk3s=8e244e95&rcl=202611281323366FD5914C647AD9F4B36C&rrcfp=25d260db&x-expires=1796448217&x-signature=NycaW2YYtObBsaUXYHw219cyxg4%3D","expires":1796448217,"ok":true,"album":"政治101","link":"https://www.doubao.com/podcast/136115e98bf2"},{"id":"64ffe8741917","title":"★★★ 05 《考研政治马原核心概念梳理》","duration":418,"audio":"https://p9-flow-sign.byteimg.com/tos-cn-i-ik7evvg4ik/rc/deep_research/80d50379e9524e9db1002e29b5d051d5?lk3s=8e244e95&rcl=20261128132337A015B65BDE9C23DDF093&rrcfp=bfce7eaa&x-expires=1796448219&x-signature=9yY3yXqMJcMAzl60dHNStevj3gQ%3D","cover":"https://p11-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/rc/deep_research/daa5453f28514e8b95c36fc40eadf2f7~tplv-a9rns2rl98-24:1280:720.image?lk3s=8e244e95&rcl=20261128132337A015B65BDE9C23DDF093&rrcfp=25d260db&x-expires=1796448219&x-signature=VcfjqzYcLvGLNkhIgRO%2BSpy5eMc%3D","expires":1796448219,"ok":true,"album":"政治101","link":"https://www.doubao.com/podcast/64ffe8741917"},{"id":"82f37d30f7d3","title":"★★ 06 思修法基的主要内容","duration":700,"audio":"https://p6-flow-sign.byteimg.com/tos-cn-i-ik7evvg4ik/rc/deep_research/8bfb0954eea24ab69157ababa6d4957f?lk3s=8e244e95&rcl=2026112519310957212F72C493752E17E6&rrcfp=bfce7eaa&x-expires=1796211070&x-signature=ih6R4yrn7DNOOd1CGzxBYd8%2BNFg%3D","cover":"https://p3-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/rc/deep_research/1933bebcadc342fcac9dd6a9fcc37a1e~tplv-a9rns2rl98-24:1280:720.image?lk3s=8e244e95&rcl=2026112519310957212F72C493752E17E6&rrcfp=25d260db&x-expires=1796211070&x-signature=z%2F0Elha2gttVg2N89ZCWvz4W0vY%3D","expires":1796211070,"ok":true,"album":"政治101","link":"https://www.doubao.com/podcast/82f37d30f7d3"},{"id":"self:建构主义","title":"★★★ 12 建构主义：四大观点与教学模式","album":"教育心理学","duration":702,"audio":"self/建构主义.mp3","cover":"","expires":0,"ok":true,"self":true,"text":"A: 今天我们聊建构主义。为什么它值得单独做一期？\nB: 因为它分量重。教育心理学里，它被称为一场革命，也是新课程改革的理论基础。\nA: 具体怎么考？\nB: 选择题考观点与流派匹配，多选题考基本观点，辨析题考概念混淆，案例分析题让你用建构主义分析教学情境。四种题型它都能出。\nA: 案例分析是不是最拉分？\nB: 是。它要求你既懂观点，又能落到材料上。等会儿我们专门演练一遍。\nA: 先问一个最基础的：建构主义到底是一套理论，还是一堆理论的统称？\nB: 统称。它不是一个单一理论，而是对认知主义学习理论的进一步发展。\nA: 和认知主义是什么关系？\nB: 认知主义已经开始关注内部加工，建构主义再往前一步，强调知识是学习者主动建构的，不是被动接收的。可以说它站在认知主义的肩膀上。\nA: 源头是哪两位？\nB: 皮亚杰和维果茨基。皮亚杰是个体建构主义的源头，同化、顺应、平衡那一套；维果茨基是社会建构主义的源头，最近发展区、社会文化。\nA: 所以它天然分成两支。\nB: 对。认知建构主义，也叫个体建构主义，关注个体怎么通过新旧经验相互作用形成认知结构，代表人物有维特罗克的生成学习理论，还有斯皮罗的认知灵活性理论。\nA: 另一支呢？\nB: 社会建构主义，以维果茨基为基础，强调知识建构的社会文化机制，学习是文化参与的过程，典型的是情境认知理论。\nA: 这两支考试会怎么考？\nB: 最常见的问法是给你一个教学场景，让你判断偏个体还是偏社会。重认知重组是个体，重参与和协商是社会。\nA: 好，接下来是重头戏，四大观点。\nB: 知识观、学生观、学习观、教学观。这是答题的标准框架，背下来不亏。\nA: 先说知识观。\nB: 一句话：知识不是对现实的准确表征，只是一种解释、一种假设，不是最终答案，会不断被改写。\nA: 那知识是不是就没用了？\nB: 不是。它的意思是知识不能拿来就用，要针对具体情境再加工、再创造。这里答题别绝对化。\nA: 学生观呢？\nB: 学生不是空着脑袋走进教室的，这句话几乎是原话。每个学生的已有经验不同，一千个读者就有一千个哈姆雷特。\nA: 所以教学要从学生的经验出发。\nB: 对，把已有经验当作新知识的生长点，而不是从零开始灌。\nA: 学习观。\nB: 学习不是教师把知识传递给学生，而是学生自己建构知识的过程。\nA: 三个特点？\nB: 主动性、社会互动性、情境性。要主动建构，要在互动中协商，还要在具体情境里发生。\nA: 教学观就好理解了。\nB: 教学不是传递知识，而是促进知识经验的生长。老师的动作是激活原有经验、创设情境、提供支持，促进而不是代替。\nA: 有一个四要素的说法。\nB: 学习环境四要素：情境、协作、会话、意义建构。很多简答题就考这四个词。\nA: 这四观能不能各来一个例子？\nB: 可以。学生观，讲光合作用，城里孩子先想到阳台的绿植，农村孩子先想到庄稼，起点不同，老师要接住各自的起点。\nA: 学习观。\nB: 老师讲一遍不等于学生学会。学生得把新知识和自己已有的经验接上，那个接的动作，就是建构。\nA: 教学观。\nB: 同一个问题，直接给答案，学生记住了；追问一句你为什么这么想，学生才开始自己长知识。\nA: 知识观呢？\nB: 课本上的结论都有适用条件。换个情境，学生要会调整，不能照搬。\nA: 选择题怎么练最有效？\nB: 四观和五种模式各记一个关键词，看到题干先找关键词，再排除行为主义。行为主义的关键词一出现，基本就不是建构主义。\nA: 这四观有没有能直接背的句子？\nB: 有几句几乎是标准答案。知识是解释或假设；学生不是空着脑袋走进教室；学习是主动建构，不是传递；教学是促进生长，不是传递。\nA: 选择题里怎么认？\nB: 题干出现知识的动态性、学生经验世界的丰富性和差异性、教学促进知识生成而不是传递，这些都是建构主义。反过来，说学习是刺激反应的简单过程，那就错了。\nA: 光背观点太虚，来点能落地的。建构主义催生了哪些教学模式？\nB: 五种最常考：支架式、抛锚式、合作学习、探究学习、随机通达。\nA: 先说支架式。\nB: 老师像脚手架，先给支持，学生能力上来了就逐步撤掉，最后让他独立完成。理论源头是维果茨基的最近发展区。\nA: 举个能记住的例子。\nB: 比如先帮学生制定周计划，下一周让他自己定、老师只提建议，最后完全放手。\nA: 抛锚式呢？\nB: 也叫情境教学，把教学建立在有感染力的真实事件或者真实问题上，那个真实问题就是锚。\nA: 例子？\nB: 班里刚发生一次同学冲突，老师就用这件事当锚，引导学生换位思考，建构新的人际认知。\nA: 合作学习。\nB: 小组讨论、争论、协作，在社会协商里修正认知偏差。源头还是维果茨基的社会互动观。\nA: 兵教兵是不是这个？\nB: 是。认知水平高的学生帮别人跨过最近发展区，就是合作学习的典型操作。\nA: 探究学习。\nB: 基于问题解决活动来建构知识。老师创设有意义的问题情境，学生在发现和解决问题的过程中学，它偏认知建构主义。\nA: 最后一个是随机通达。\nB: 同一个内容，在不同情境、不同时间多次学习，每次着眼问题的不同侧面，最后形成多角度理解。源头是斯皮罗的认知灵活性理论。\nA: 为什么叫随机？\nB: 不是说随便，而是每次进入的角度可以不同。一个概念用多个变式实例反复呈现，避免机械记忆。\nA: 题干里怎么快速判断是哪种模式？\nB: 看动作。有人搭架子、逐步撤走，是支架式；有个真实事件当锚，是抛锚式；小组讨论、兵教兵，是合作学习；学生自己发现和解决问题，是探究学习；同一内容换情境反复学，是随机通达。\nA: 这五种怎么快速记？\nB: 记住每个的源头。支架式对最近发展区，抛锚式对情境认知，合作学习对社会互动，探究学习对认知建构，随机通达对认知灵活性。\nA: 还有一层意义，课程改革。\nB: 建构主义是我国基础教育课程改革的直接理论基础之一。新课改提的自主、合作、探究，心理学依据就是它。\nA: 所以案例分析里经常会说体现了新课改理念。\nB: 对，这句话放在结尾能加分。\nA: 接下来是辨析。建构主义最常和谁对比？\nB: 行为主义。这个对比几乎每年都能出题。\nA: 从学习实质上说。\nB: 行为主义是刺激反应的联结，建构主义是主动建构心理意义。\nA: 关注点。\nB: 行为主义看外部行为改变，建构主义看内部认知加工。\nA: 教师角色。\nB: 行为主义里老师是训练者、强化者；建构主义里是促进者、脚手架的搭建者。\nA: 关键词也很不一样。\nB: 行为主义的关键词是试误、强化、惩罚、消退、程序教学；建构主义是同化顺应、最近发展区、支架、情境、协作。\nA: 代表人物呢？\nB: 行为主义是桑代克、巴甫洛夫、斯金纳、班杜拉；建构主义是皮亚杰、维果茨基、布鲁纳。\nA: 这里有个高频陷阱，代表人物。\nB: 对，建构主义不是只有皮亚杰，还有维果茨基、布鲁纳、斯腾伯格。\nA: 第二个陷阱。\nB: 先行组织者不属于建构主义，它是奥苏贝尔的概念，属于认知主义。这个几乎年年考。\nA: 第三个。\nB: 知识观不要绝对化。建构主义说知识是解释和假设，但它并不否认客观世界的存在，质疑的是知识对现实的准确表征。\nA: 第四个。\nB: 两种建构主义要分清：个体建构主义重内部认知重组，社会建构主义重社会文化参与和协商。\nA: 好，来演练一个案例。一位老师讲浮力，先让学生回忆游泳时身体的感觉，再分组用橡皮泥造船，看哪组装得多，最后请各组说理由，老师只追问不下结论。这体现什么？\nB: 先亮明：体现建构主义的学习观和教学观，也用到了探究学习和合作学习。\nA: 展开观点。\nB: 知识观上，浮力的概念不是老师直接给的结论，是学生在情境中加工出来的；学生观上，老师从游泳经验出发，把已有经验当生长点；学习观上，学生动手、讨论，是主动建构，加上社会互动和情境性。\nA: 对应分析。\nB: 橡皮泥造船是创设情境，分组是协作与会话，最后说理由是意义建构。老师追问不结论，是促进而不是代替。\nA: 总结提升。\nB: 这种做法体现新课改自主、合作、探究的理念，有利于深度理解和迁移。\nA: 这个四步模板很实用。\nB: 记住顺序：亮明理论，展开三观，对应材料，总结提升。\nA: 最后给听众三个必须记住的词。\nB: 主动建构、情境、社会互动。\nA: 再用一句话收尾。\nB: 建构主义把学习从知识的搬运，重新定义成意义的创造。知识不是被装进学生头脑的，而是学生在真实情境里、和他人协作中、在已有经验之上主动生长出来的。\nA: 这句话我记下了。今天就到这儿。\nB: 下次可以接着聊它和认知主义、行为主义三家的完整对比。","link":""},{"id":"self:迁移理论六说","title":"★★★ 13 迁移理论六说：六个理论一条线","album":"教育心理学","duration":493,"audio":"self/迁移理论六说.mp3","cover":"","expires":0,"ok":true,"self":true,"text":"A: 今天我们聊迁移理论的六大学说。先问一句，迁移到底指什么？\nB: 简单说，就是一种学习对另一种学习的影响。学会了骑自行车，再学摩托车更快，这就是正迁移。\nA: 迁移只有正向的吗？\nB: 分三种。正迁移是促进，负迁移是干扰，比如先学的拼音干扰英语字母；零迁移就是没有影响。\nA: 那六个理论，是在回答什么问题？\nB: 回答同一个问题：迁移为什么会发生。从早期的官能训练，一路走到现代的认知结构和产生式。\nA: 六说分别是哪六个？\nB: 形式训练说、共同要素说、概括化理论、关系转换理论、认知结构迁移理论、产生式迁移理论。\nA: 这六个是随便排的吗？\nB: 不是，是一条批判继承的线。桑代克用实验否定形式训练说，贾德和苛勒在共同要素内部继续追问，现代理论再把视野转到学习者内部。\nA: 所以顺序本身就是考点。\nB: 对，答题时按时间线写，逻辑分就拿到了。\nA: 按时间排，第一个是形式训练说。\nB: 沃尔夫提出，建立在官能心理学上。心智由记忆、思维这些官能组成，官能练强了，就能自动迁移到一切活动。\nA: 听起来很玄。\nB: 它没有系统实验，只有思辨，后来被桑代克用实验否定了。它的价值是提示了能力训练，但不能迷信学难懂的东西就能提高智力。\nA: 第二个，共同要素说。\nB: 桑代克和伍德沃斯。只有当两种情境存在相同的要素，也就是共同的刺激反应联结，一种机能的变化才能带动另一种。共同要素越多，迁移越大。\nA: 经典实验是图形面积。\nB: 对。先训练大学生估计平行四边形面积，再去判断矩形，成绩提高了；判断三角形、圆形，没有提高。因为矩形和平行四边形有共同要素。\nA: 这个理论的局限？\nB: 只看到情境的客观因素，忽视学习者的认知加工，也解释不了负迁移，比如前摄抑制和倒摄抑制。\nA: 教学上怎么用？\nB: 注意情境之间的相似性。会骑自行车，学摩托车就容易迁移，因为平衡和操控有共同要素。\nA: 第三个，概括化理论，也叫经验类化说。\nB: 贾德。他认为关键不是共同要素本身，而是学习者对经验的概括。概括水平越高，迁移越容易发生。\nA: 水下击靶。\nB: 浅水一米二的时候，学过光学折射原理的甲组和没学的乙组成绩一样；靶子移到深水，甲组能概括折射原理、迅速调整，成绩明显更好。\nA: 所以教学要\"为概括而教\"。\nB: 对，强调基本概念和原理。但概括只是条件之一，忽略情境差异会变成机械定势。\nA: 第四个，关系转换理论。\nB: 苛勒，格式塔学派。迁移是突然发现两种情境之间内在关系的结果，也就是顿悟。重点不在掌握原理，而在觉察手段和目的的关系。\nA: 小鸡啄米实验。\nB: 先训练小鸡从深灰色纸下取食，再把浅灰纸换成更黑的纸。结果七成的小鸡转向更黑的那张，说明它顿悟的是颜色更深这个关系，不是某张具体的纸。\nA: 局限是过分强调顿悟。\nB: 对，忽视经验积累。\nA: 第五个，认知结构迁移理论。\nB: 奥苏贝尔。一切有意义学习都建立在原有认知结构上，迁移通过认知结构这个中介实现，取决于三个变量。\nA: 哪三个？\nB: 可利用性，有没有合适的固着点；可辨别性，新旧知识能不能分清；稳定性和清晰性，原有知识牢不牢。\nA: 教学启示就是\"为迁移而教\"。\nB: 塑造好的认知结构。它主要解释陈述性知识，对程序性技能解释力不足。\nA: 第六个，产生式迁移理论。\nB: 辛格莱和安德森，基于安德森的思维适应性控制理论。它针对程序性知识，迁移的原因是前后任务之间产生式的重叠。\nA: 产生式是什么？\nB: 条件到动作的规则，也就是如果怎样，就怎样。重叠越多，迁移量越大。教学上强调条件动作规则的反复练习和变式训练。\nA: 六说怎么分组记？\nB: 早期四说，形式训练、共同要素、概括化、关系转换；现代两说，认知结构、产生式。早期争迁移的条件是什么，现代问迁移靠什么心理机制。\nA: 六个讲完了，来三组最容易混的辨析。\nB: 第一组，共同要素说和概括化理论。\nA: 都说共同？\nB: 但桑代克的共同要素是客观存在的具体刺激反应成分，学生自己未必意识到；贾德的概括是学习者主动抽取的一般原理。一句话，前者客观相同，后者主观提炼。\nA: 第二组，概括化和关系转换。\nB: 贾德强调对原理的抽象概括，水下击靶里是折射定律；苛勒强调对关系的整体顿悟，小鸡实验里是更黑的那张纸下有食物这个相对关系。\nA: 第三组，认知结构和概括化。\nB: 贾德谈迁移的内容是什么，是概括出的原理；奥苏贝尔谈迁移借以发生的心理结构怎么样，是三个变量。一个问内容，一个问结构。\nA: 三个实验怎么速记？\nB: 桑代克图形面积，证明共同要素是必要条件；贾德水下击靶，证明原理概括是关键；苛勒小鸡啄米，证明关系顿悟。\nA: 有没有一句话记住六个人？\nB: 沃尔夫练官能，桑代克找要素，贾德做概括，苛勒靠顿悟，奥苏贝尔看结构，安德森数产生式。\nA: 来个快问快答。水下击靶是谁？\nB: 贾德，概括化理论。\nA: 小鸡啄米？\nB: 苛勒，关系转换。\nA: 图形面积？\nB: 桑代克，共同要素。\nA: 三个变量？\nB: 奥苏贝尔，认知结构。\nA: 条件动作规则？\nB: 安德森，产生式。\nA: 为迁移而教，具体做什么？\nB: 精选教材内容，合理编排顺序，教授学习策略，还要创设相似的应用情境，让学生真的有机会用。\nA: 简答题的模板？\nB: 人物、核心观点、经典实验、评价，四步各一两句话，别写成长篇。\nA: 考试怎么考？\nB: 选择题考人物、理论、实验的匹配；简答按人物、观点、实验、评价四步写；案例题常结合\"为迁移而教\"，比如精选教材、合理编排顺序、教学习策略、创设相似情境。\nA: 还有补充吗？\nB: 有的教材会加第七说，情境性理论，格林诺。他认为迁移是用不变的活动结构去适应不同情境，强调真实情境里的作用。\nA: 那现代研究怎么看这六说？\nB: 已经不再争谁对，而是按知识类型选框架。概念原理用认知结构，技能训练用产生式，真实情境用情境性理论。\nA: 一句话收尾。\nB: 六说不是六个孤立的答案，是一条从练官能，到看结构、数产生式的进化线。","link":""},{"id":"self:四大全球倡议","title":"★★★ 07 四大全球倡议与全球治理","album":"政治101","duration":481,"audio":"self/四大全球倡议.mp3","cover":"","expires":0,"ok":true,"self":true,"text":"A: 今天我们聊四大全球倡议。先说一句，为什么它今年特别重要。\nB: 因为提法变了。以前说三大倡议，二〇二五年新增了全球治理倡议，现在是四大倡议。\nA: 这个变化本身就是考点。\nB: 对，选择题最爱在这里挖坑。问几大倡议，答案已经不是三，是四。\nA: 四个倡议，先按时间和场合排一遍。\nB: 全球发展倡议，二〇二一年九月，联合国大会。全球安全倡议，二〇二二年四月，博鳌亚洲论坛。全球文明倡议，二〇二三年三月，中国共产党与世界政党高层对话会。全球治理倡议，二〇二五年九月，上海合作组织加会议。\nA: 顺序是发展、安全、文明、治理。\nB: 记住这条线就不会乱：先发展，再安全，再文明，最后落到治理。\nA: 一个一个来。发展倡议是六个坚持。\nB: 发展优先，以人民为中心，普惠包容，创新驱动，人与自然和谐共生，行动导向。\nA: 六条里最容易漏的是哪一条？\nB: 行动导向。前面五条都像理念，最后一条讲落地，所以常被漏掉。还有一个坑：二〇二一年提出，不是二〇二二年。\nA: 安全倡议也是六个坚持。\nB: 第一条是共同、综合、合作、可持续的安全观。后面是尊重各国主权和领土完整，遵守联合国宪章宗旨和原则，重视各国合理安全关切，通过对话协商和平解决分歧，统筹维护传统与非传统安全。\nA: 这里有个细节。\nB: 共同、综合、合作、可持续，四个词的顺序固定，而且只在第一条出现，别拆开去配后面的条目。\nA: 文明倡议是四个共同倡导。\nB: 尊重世界文明多样性，弘扬全人类共同价值，重视文明传承和创新，加强国际人文交流合作。\nA: 注意是倡导，不是坚持。\nB: 对。文明倡议用四个倡导，发展、安全、治理都用坚持。另外，全人类共同价值要单独记，别跟文明倡议混在一起。\nA: 治理倡议是五个坚持。\nB: 坚持主权平等，这是首要前提；坚持国际法治，这是根本保障；坚持多边主义，这是基本路径；坚持以人为本；坚持注重行动。\nA: 五条里也有一条容易漏。\nB: 注重行动。另外三个定位别配错：首要前提只给主权平等，根本保障只给国际法治，基本路径只给多边主义。\nA: 四个倡议的条数，六、六、四、五。\nB: 发展六，安全六，文明四，治理五。念一遍，六六四五，条数就不会错。\nA: 那这四个倡议在整个体系里算什么位置？\nB: 中国方案有三个层次。理念是人类命运共同体，倡议是四大全球倡议，实践是高质量共建一带一路。\nA: 三层不能混说。\nB: 分析题常问三者关系：理念定方向，倡议搭框架，实践出成果。\nA: 往下还有一组高频的赤字。\nB: 全球治理四大赤字：和平赤字、发展赤字、安全赤字、治理赤字。\nA: 这四个要不要跟四个倡议一一对应？\nB: 不要机械对应。赤字是问题清单，倡议是对策清单，出题人会故意让你对号入座。\nA: 全球治理观呢？\nB: 共商共建共享。三个共，别写成共治共享。\nA: 还有国际秩序的三个以什么为基础。\nB: 以联合国为核心的国际体系，以国际法为基础的国际秩序，以联合国宪章宗旨和原则为基础的国际关系基本准则。\nA: 这三句最容易换位。\nB: 记一句话：核心只给联合国。谁当核心，答案只有一个。\nA: 再看当代世界经济与政治。\nB: 经济全球化，表现是生产、贸易、金融、科技的全球化；动力是科技革命和市场经济；它是一把双刃剑。\nA: 有两个错误说法要避开。\nB: 全球化不等于一体化，更不等于西方化。逆全球化只是现象，不等于全球化终结。\nA: 世界多极化呢？\nB: 新兴市场国家和发展中国家群体性崛起，国际力量对比深刻调整。多极是趋势，不是已经定局，一超多强是旧提法。\nA: 全球南方这个词。\nB: 不是地理概念，指的是新兴市场国家和发展中国家，诉求是提升代表性和发言权。\nA: 南北关系的核心是什么？\nB: 发展问题。南北矛盾落在发展上，不是安全上。\nA: 最后补一个外交布局，四个定位。\nB: 大国是关键，周边是首要，发展中国家是基础，多边是重要舞台。\nA: 这四个最容易被互换。\nB: 记法：大国是关键，不是首要；周边才是首要。考场上凭直觉选周边做关键，就错了。\nA: 顺手再过几个必考词。人类命运共同体建的是几个世界？\nB: 五个：持久和平、普遍安全、共同繁荣、开放包容、清洁美丽。顺序常考。\nA: 全人类共同价值是六个。\nB: 和平、发展、公平、正义、民主、自由。注意是共同价值，不是普世价值。\nA: 新型国际关系？\nB: 相互尊重、公平正义、合作共赢。三个词，核心不是结盟。别跟新型大国关系混。\nA: 一带一路的关键数字。\nB: 二〇一三年提出，共商共建共享，五通：政策沟通、设施联通、贸易畅通、资金融通、民心相通。是五通，不是五路。\nA: 中国在国际体系里的四个身份。\nB: 世界和平的建设者，全球发展的贡献者，国际秩序的维护者，公共产品的提供者。最容易漏最后一个。\nA: 现在快问快答。二〇二五年新增哪个倡议？\nB: 全球治理倡议，二〇二五年九月，上合加会议。\nA: 治理倡议的首要前提？\nB: 主权平等。\nA: 发展倡议六条里最易漏哪条？\nB: 行动导向。\nA: 文明倡议是几个倡导？\nB: 四个共同倡导。\nA: 四个倡议的提出顺序？\nB: 发展、安全、文明、治理。\nA: 中国方案三层次？\nB: 理念是人类命运共同体，倡议是四大全球倡议，实践是高质量共建一带一路。\nA: 四大赤字？\nB: 和平、发展、安全、治理。\nA: 国际秩序三个以什么为。\nB: 以联合国为核心，以国际法为基础，以联合国宪章宗旨和原则为基础。\nA: 一句话收尾。\nB: 四大倡议是框架，赤字是问题，三个以什么为是底线，三层次是答题骨架。听完这一集，把数字索引表和限定词表再对一遍，选择题就稳了。","link":""},{"id":"self:限定词归属表","title":"★★ 08 限定词归属表：22 个唯一答案","album":"政治101","duration":421,"audio":"self/限定词归属表.mp3","cover":"","expires":0,"ok":true,"self":true,"text":"A: 今天我们单独聊一张表，限定词归属表。\nB: 就是题干里一出现某个限定词，答案就被锁死的那张表。\nA: 为什么值得单独做一集？\nB: 因为它不考理解，只考记准。记串了，题就白丢。\nA: 先讲用表的原则。\nB: 三条。第一，题干里出现根本、首要、核心、本质、前提这些路标词，先想这张表。第二，先认限定词，再回想归属，不要凭语感。第三，只收唯一归属的条目，有几个答案的题目不在这张表里。\nA: 那我们从哪一组开始？\nB: 从党的领导开始，这一组最容易串。\nA: 中国特色社会主义最本质的特征和最大优势是什么？\nB: 中国共产党领导。两个问法，一个答案。\nA: 党的根本宗旨。\nB: 全心全意为人民服务。\nA: 党的最大政治优势。\nB: 密切联系群众。\nA: 执政后的最大危险。\nB: 脱离群众。\nA: 这四个要连起来记。\nB: 优势是联系群众，危险是脱离群众，一体两面。宗旨是服务人民，别跟优势混。\nA: 下一组，现代化。\nB: 中国式现代化本质要求的第一条，是坚持中国共产党领导。\nA: 全面建设社会主义现代化国家的首要任务。\nB: 高质量发展。\nA: 党执政兴国的第一要务。\nB: 发展。\nA: 首要任务和第一要务容易混。\nB: 一字之差。首要任务给高质量发展，第一要务只给发展，多一个字都错。\nA: 现代化国家的基础性、战略性支撑。\nB: 教育、科技、人才。三个并列，少说一个都不完整。\nA: 下一组，民主与法治。\nB: 社会主义民主政治的本质属性，是全过程人民民主。\nA: 它的特点。\nB: 全链条、全方位、全覆盖。三个全，别只答一个。\nA: 全面依法治国的总目标。\nB: 建设中国特色社会主义法治体系，建设社会主义法治国家。两个建设，一个都不能少。\nA: 依法治国的核心，也叫首先要坚持。\nB: 依宪治国，落到宪法。\nA: 这里最容易错在哪？\nB: 总目标是两个建设，核心只有依宪治国一个词。别把总目标缩成一句话，也别把核心答成法律体系。\nA: 再看社会主义本质。\nB: 解放生产力，发展生产力，消灭剥削，消除两极分化，最终达到共同富裕。五个短句，顺序也常考。\nA: 历史和理论的两条。\nB: 新民主主义革命的三大法宝：统一战线、武装斗争、党的建设。毛泽东思想活的灵魂：实事求是、群众路线、独立自主。\nA: 这两个都是三个词，特别容易互换。\nB: 三大法宝是革命的，活的灵魂是思想的。法宝里带斗争，灵魂里带路线。\nA: 改革开放的定位。\nB: 决定当代中国命运的关键一招。\nA: 注意是关键一招。\nB: 对，关键一招只给改革开放，别挪给发展或者创新。\nA: 精神这一组。\nB: 民族精神的核心是爱国主义，时代精神的核心是改革创新。\nA: 这一组几乎每年都考。\nB: 一句话记：民族重爱国，时代重创新。\nA: 道德这一组。\nB: 道德建设的核心是为人民服务，原则是集体主义。\nA: 也别混。\nB: 核心给服务，原则给集体。顺序反过来就是错项。\nA: 总体国家安全观这一组最容易乱。\nB: 宗旨是人民安全，根本是政治安全，基础是经济安全。\nA: 三个词配三个安全。\nB: 宗旨人民，根本政治，基础经济。记住这个句式，题就稳。\nA: 还有两个单独的。\nB: 一国两制的前提和基础，是一个中国原则。强军目标是听党指挥、能打胜仗、作风优良。\nA: 人生观念这一组。\nB: 人生观三要素里的核心是人生目的，人生价值评价的根本尺度是劳动和贡献。\nA: 为什么核心是人生目的？\nB: 目的决定方向和态度，所以它当核心。评价尺度看劳动和贡献，不看索取。\nA: 全表过完了，现在做三组高危辨析。\nB: 第一组，最本质特征和最大优势都是党的领导，但根本宗旨是服务人民，最大政治优势是联系群众。四个词，两个答案。\nA: 第二组。\nB: 民族精神核心是爱国主义，时代精神核心是改革创新，道德核心是为人民服务。三个核心，三个不同答案。\nA: 第三组。\nB: 总体国家安全观，宗旨人民安全，根本政治安全，基础经济安全。三个定位不能换。\nA: 好，快问快答。我说限定词，你说归属。\nB: 来。\nA: 最本质的特征。\nB: 中国共产党领导。\nA: 执政后的最大危险。\nB: 脱离群众。\nA: 首要任务。\nB: 高质量发展。\nA: 第一要务。\nB: 发展。\nA: 基础性、战略性支撑。\nB: 教育、科技、人才。\nA: 民主政治的本质属性。\nB: 全过程人民民主。\nA: 依法治国的核心。\nB: 依宪治国。\nA: 民族精神的核心。\nB: 爱国主义。\nA: 道德建设的原则。\nB: 集体主义。\nA: 总体国家安全观的根本。\nB: 政治安全。\nA: 人生价值评价的根本尺度。\nB: 劳动和贡献。\nA: 最后一个，改革开放的定位。\nB: 决定当代中国命运的关键一招。\nA: 收尾说一个自测方法。\nB: 把表盖住右边，只看限定词，一个个说归属。说不出的在前面打个点，第二天先过打点的。\nA: 一天过一遍，三天就熟。\nB: 还有一句提醒：这类题靠的是认词，不是理解。看到根本、首要、核心、本质、前提，先停一秒，回这张表。","link":""}]}</script>

<script>
(function(){
'use strict';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const LS_PROG = 'podcast.v2.progress';
const LS_SET  = 'podcast.v2.settings';
const LS_LAST = 'podcast.v2.last';

let LIB = null;
let items = [];
let groups = [];
let curId = null;
let queue = [];
let qIndex = -1;
let rate = 1;
let prog = {};
let curView = 'list';
let scrub = false;
let switching = false;
let lastSave = 0;
let navDepth = 0;
let miniFor = null;
let curUrl = null;
let curFromCache = false;
let filterAlbum = null;
let searching = false;
let searchQuery = '';
let subBeforeSearch = '';
const restore = { lastTried: false };

const au = $('au');

/* ---------- 本地状态 ---------- */
function loadLocal(){
  try{
    const p = JSON.parse(localStorage.getItem(LS_PROG) || '{}');
    if(p && typeof p === 'object') prog = p;
  }catch(e){ prog = {}; }
  try{
    const s = JSON.parse(localStorage.getItem(LS_SET) || '{}');
    if(s && typeof s.rate === 'number' && s.rate >= 0.5 && s.rate <= 2) rate = s.rate;
  }catch(e){ rate = 1; }
}
function saveProg(){
  try{ localStorage.setItem(LS_PROG, JSON.stringify(prog)); }
  catch(e){ toast('进度没存上，手机存储可能满了'); }
}
function saveSet(){
  try{ localStorage.setItem(LS_SET, JSON.stringify({ rate })); }catch(e){}
}

/* ---------- 工具 ---------- */
function fmt(s){
  s = Math.max(0, Math.floor(s || 0));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  return h ? h + ':' + String(m).padStart(2, '0') + ':' + String(x).padStart(2, '0')
           : m + ':' + String(x).padStart(2, '0');
}
function fmtLong(s){
  s = Math.max(0, Math.round(s || 0));
  if(s < 60) return s + ' 秒';
  const m = Math.round(s / 60);
  return m >= 60 ? Math.floor(m / 60) + ' 小时 ' + (m % 60) + ' 分' : m + ' 分钟';
}
function ago(ts){
  if(!ts) return '';
  const d = Date.now() - new Date(ts).getTime();
  if(d < 60000) return '刚刚更新';
  if(d < 3600000) return Math.round(d / 60000) + ' 分钟前更新';
  if(d < 86400000) return Math.round(d / 3600000) + ' 小时前更新';
  return Math.round(d / 86400000) + ' 天前更新';
}
function hash(str){
  let h = 2166136261;
  for(let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
/* 标题前缀的星级（★★★ / ★★ / ★）单独渲染成标记 */
function splitTitle(t){
  const s = String(t || '');
  const m = s.match(/^([★☆!！]+)\s*(.*)$/);
  return m ? { mark: m[1], text: m[2] } : { mark: '', text: s };
}
function starHtml(t){
  const m = splitTitle(t).mark;
  return m ? '<span class="star">' + esc(m) + '</span>' : '';
}

function coverBg(seed){
  const h = hash(String(seed || 'x')) % 360;
  return 'linear-gradient(150deg,hsl(' + h + ' 42% 34%),hsl(' + ((h + 38) % 360) + ' 46% 20%))';
}
function toast(msg){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('on'), 2600);
}
function expired(it){
  if(it.self) return false;   // 自己生成的音频在仓库里，不会过期
  return !it.expires || it.expires * 1000 < Date.now();
}
/* 标题去掉编号后的第一个字，用来做封面占位 */
function titleChar(it){
  const t = splitTitle(it.title).text.replace(/^\d{1,2}[\s.、]*/, '');
  return t[0] || '播';
}
function byId(id){ return items.find(x => x.id === id) || null; }
function current(){ return curId ? byId(curId) : null; }

/* ---------- 读清单 ---------- */
function readSnapshot(){
  try{
    const el = $('lib-snapshot');
    if(!el) return null;
    const j = JSON.parse(el.textContent || 'null');
    return j && Array.isArray(j.items) && j.items.length ? j : null;
  }catch(e){
    return null;
  }
}

async function loadLib(manual){
  const btn = $('btnRefresh');
  btn.classList.add('spin');

  let j = null;
  let fromSnapshot = false;

  try{
    const res = await fetch('./library.json?t=' + Date.now(), { cache: 'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    j = await res.json();
    if(!j || !Array.isArray(j.items)) throw new Error('清单格式不对');
  }catch(err){
    console.warn('[library] 网络读取失败，尝试快照', err);
    j = readSnapshot();
    fromSnapshot = true;
    if(!j){
      btn.classList.remove('spin');
      $('sub').textContent = '清单读不到';
      $('empty').style.display = 'block';
      $('empty').innerHTML =
        '<div class="big">⚠️</div><b>还没有清单</b>' +
        '先在电脑上运行 <code>bun resolve.mjs</code><br>' +
        '它会把清单写进这个 html，之后双击就能听。';
      if(manual) toast('刷新失败：' + err.message);
      return;
    }
  }

  btn.classList.remove('spin');
  LIB = j;
  items = j.items.filter(x => x && x.id && x.title);
  buildGroups();
  renderList();

  $('sub').textContent =
    (fromSnapshot ? '离线快照 · ' : '') + ago(j.updatedAt) + ' · ' + items.length + ' 集' +
    (j.failed ? ' · ' + j.failed + ' 集未就绪' : '');

  if(manual){
    toast(fromSnapshot
      ? '本地文件模式用的是内嵌快照。要更新，运行 bun resolve.mjs'
      : '已刷新');
  }

  if(!restore.lastTried && items.length){
    restore.lastTried = true;
    restoreLast();
  }
}

function buildGroups(){
  groups = [];
  const map = new Map();
  for(const it of items){
    const a = it.album || '未分组';
    if(!map.has(a)){ map.set(a, []); groups.push({ album: a, list: map.get(a) }); }
    map.get(a).push(it);
  }
  queue = groups.flatMap(g => g.list);
}

/* ---------- 列表渲染 ---------- */
function isMulti(){
  return groups.length > 1 || !!(groups[0] && groups[0].album !== '未分组');
}

function visibleGroups(){
  let list = filterAlbum ? groups.filter((g) => g.album === filterAlbum) : groups;

  const q = searchQuery.trim().toLowerCase();
  if(q){
    list = list
      .map((g) => ({
        album: g.album,
        list: g.list.filter((it) =>
          String(it.title || '').toLowerCase().includes(q) ||
          String(it.album || '').toLowerCase().includes(q)
        )
      }))
      .filter((g) => g.list.length);
  }

function renderList(){

  if(searching){
    $('filters').style.display = 'none';
  }else{

    const n = list.reduce((s, g) => s + g.list.length, 0);
    const q = searchQuery.trim();

function itemEl(it){
  const el = document.createElement('div');
  el.className = 'item' + (it.id === curId ? ' on' : '') +
    (it.id === curId && !au.paused ? ' playing' : '');
  el.dataset.id = it.id;

  const dur = it.duration || 0;
  const p = prog[it.id] || 0;
  const pct = dur ? Math.min(100, p / dur * 100) : 0;
  const done = dur && p >= dur - 5;
  const pending = !!it.pending;
  const bad = !pending && (!it.ok || expired(it));

  const metaBits = [];
  if(dur) metaBits.push(fmtLong(dur));
  if(it.self) metaBits.push('<span class="badge self">自制</span>');
  if(it.album && it.album !== '未分组' && !isMulti()) metaBits.push(it.album);
  const dead = !pending && /失效/.test(it.error || '');
  const generating = !pending && !dead && /生成/.test(it.error || '');
  if(pending) metaBits.push('<span class="badge">待补链接</span>');
  else if(dead) metaBits.push('<span class="badge bad">链接失效</span>');
  else if(generating) metaBits.push('<span class="badge">生成中</span>');
  else if(bad) metaBits.push('<span class="badge bad">地址过期</span>');
  else if(done) metaBits.push('<span class="badge done">已听完</span>');
  else if(pct > 0.5) metaBits.push(Math.round(pct) + '%');

  const ac = albumColor(it.album);
  const ph = pending ? '待' : (!it.ok ? (generating ? '生' : '!') : '');
  const plain = ph || !it.cover;

  const covStyle = plain
    ? 'background:linear-gradient(150deg,#FFFFFF,' + ac.soft + ');color:' + ac.main + ';box-shadow:inset 0 0 0 2px ' + ac.dim
    : 'background:' + coverBg(it.id) + ';box-shadow:inset 0 0 0 2px ' + ac.dim;
  const covChar = ph || titleChar(it);
  const playingColor = (it.id === curId && !au.paused) ? ' style="color:' + ac.main + '"' : '';

  el.innerHTML =
    '<div class="cov" style="' + covStyle + '">' +
      '<span>' + esc(covChar) + '</span>' +
      (it.cover ? '<img src="' + esc(it.cover) + '" alt="" loading="lazy" referrerpolicy="no-referrer">' : '') +
    '</div>' +
    '<div class="info">' +
      '<b' + playingColor + '>' + starHtml(it.title) + esc(splitTitle(it.title).text) + '</b>' +
      '<div class="meta">' + metaBits.join(' · ') + '</div>' +
      (pct > 0.5 && !bad ? '<div class="pbar-mini"><i style="width:' + pct + '%"></i></div>' : '') +
    '</div>' +
    '<button class="dl' + (cacheIdx[it.id] ? ' on' : '') + '" aria-label="缓存到手机">' +
      dlLabel(it) + '</button>';

  const img = el.querySelector('.cov img');
  if(img) img.addEventListener('error', () => img.remove());

  el.addEventListener('click', () => play(it.id));
  el.querySelector('.dl').addEventListener('click', (e) => {
    e.stopPropagation();
    toggleDownload(it);
  });
  return el;
}

/* ---------- 播放 ---------- */
async function play(id){
  const it = byId(id);
  if(!it) return;
  if(it.pending){ toast('这一集还没填链接'); return; }

  const saved = !!cacheIdx[it.id];

  if((!it.ok || !it.audio) && !saved){
    toast('这一集没有音频地址，等清单刷新后再试');
    return;
  }
  if(expired(it) && !saved){
    toast('这一集的地址过期了。点右上角 ↻ 重新拉清单；还是不行就等 GitHub 每天自动刷新。');
    return;
  }

  if(id === curId && au.src){
    // 已经缓存了但当前还挂在网络源上：换成本地文件，保留播放位置
    if(cacheIdx[id] && !curFromCache){
      const pos = au.currentTime || 0;
      switching = true;
      const src = await resolveSrc(it);
      au.src = src;
      au.playbackRate = rate;
      au.addEventListener('loadedmetadata', () => {
        if(pos > 1){ try{ au.currentTime = pos; }catch(e){} }
        au.play().catch(() => {});
      }, { once: true });
      if(curView !== 'player') go('player');
      return;
    }

    if(au.paused) au.play().catch(() => toast('播放失败'));
    else au.pause();
    if(curView !== 'player') go('player');
    return;
  }

  saveProgress(true);
  curId = id;
  try{ localStorage.setItem(LS_LAST, id); }catch(e){}
  qIndex = queue.findIndex(x => x.id === id);

  switching = true;
  au.src = await resolveSrc(it);
  au.playbackRate = rate;

  renderAll();
  updateMedia();
  if(curView !== 'player') go('player');

  try{ await au.play(); }
  catch(err){ console.warn('[play]', err); toast('点播放键开始'); }
}

async function restoreLast(){
  let id = null;
  try{ id = localStorage.getItem(LS_LAST); }catch(e){}
  if(!id || !byId(id)) id = items[0] && items[0].id;
  if(!id) return;

  const it = byId(id);
  if(!it) return;

  const saved = !!cacheIdx[it.id];
  if((!it.ok || !it.audio) && !saved) return;
  if(expired(it) && !saved) return;

  curId = id;
  qIndex = queue.findIndex((x) => x.id === id);
  au.src = await resolveSrc(it);
  au.playbackRate = rate;
  updateMedia();
  renderMini();
}

function next(auto){
  if(!queue.length) return;
  if(qIndex + 1 < queue.length) play(queue[qIndex + 1].id);
  else{
    au.pause();
    if(auto) toast('这一批听完了');
  }
}
function prev(){
  if(au.currentTime > 4){ au.currentTime = 0; return; }
  if(qIndex > 0) play(queue[qIndex - 1].id);
  else au.currentTime = 0;
}

const RATES = [0.75, 1, 1.25, 1.5, 1.75, 2];
function cycleRate(){
  const i = RATES.indexOf(rate);
  rate = RATES[(i + 1) % RATES.length];
  au.playbackRate = rate;
  saveSet();
  $('btnRate').textContent = rate.toFixed(2).replace(/0$/, '') + '×';
  toast(rate + '×');
}

function updateSeekUI(){
  const it = current();
  const d = au.duration || (it ? it.duration : 0) || 0;
  if(!scrub){
    const v = d ? Math.round(au.currentTime / d * 1000) : 0;
    $('seek').value = v;
    $('seek').style.setProperty('--pct', (d ? au.currentTime / d * 100 : 0) + '%');
  }
  $('tCur').textContent = fmt(au.currentTime);
  $('tDur').textContent = fmt(d);
  $('mProg').style.width = (d ? au.currentTime / d * 100 : 0) + '%';
}

function saveProgress(force){
  const it = current();
  if(!it) return;
  if(!force && Date.now() - lastSave < 5000) return;
  lastSave = Date.now();
  if(isFinite(au.currentTime) && au.currentTime > 0 && !au.ended){
    prog[it.id] = au.currentTime;
    saveProg();
  }
}

/* ---------- Media Session ---------- */
function updateMedia(){
  if(!('mediaSession' in navigator)) return;
  const it = current();
  if(!it) return;
  const artwork = it.cover
    ? [{ src: it.cover, sizes: '512x512', type: 'image/jpeg' }]
    : [];
  try{
    navigator.mediaSession.metadata = new MediaMetadata({
      title: splitTitle(it.title).text,
      artist: it.album || '豆包 AI 播客',
      album: '播客台',
      artwork
    });
  }catch(e){}
}
function initMedia(){
  if(!('mediaSession' in navigator)) return;
  const act = (n, f) => { try{ navigator.mediaSession.setActionHandler(n, f); }catch(e){} };
  act('play', () => au.play().catch(() => {}));
  act('pause', () => au.pause());
  act('previoustrack', prev);
  act('nexttrack', () => next(false));
  act('seekbackward', (d) => { au.currentTime = Math.max(0, au.currentTime - (d.seekOffset || 15)); });
  act('seekforward', (d) => { au.currentTime = Math.min(au.duration || 0, au.currentTime + (d.seekOffset || 15)); });
  act('seekto', (d) => { au.currentTime = d.seekTime; });
}

/* ---------- 本地缓存：音频存手机，听过就不用再走流量 ---------- */
const CACHE_KEY = 'podcast.v2.cache';
const AUDIO_DB = 'podcast-audio';
const AUDIO_STORE = 'audio';

let cacheIdx = {};      // id -> { size, savedAt }
const dlProgress = {};  // id -> { got, total }
let dbP = null;

function openDb(){
  if(dbP) return dbP;
  dbP = new Promise((res, rej) => {
    let r;
    try{ r = indexedDB.open(AUDIO_DB, 1); }catch(e){ rej(e); return; }
    r.onupgradeneeded = () => {
      const d = r.result;
      if(!d.objectStoreNames.contains(AUDIO_STORE)) d.createObjectStore(AUDIO_STORE);
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbP;
}

function idbPut(key, val){
  return openDb().then((d) => new Promise((res, rej) => {
    const tx = d.transaction(AUDIO_STORE, 'readwrite');
    tx.objectStore(AUDIO_STORE).put(val, key);
    tx.oncomplete = () => res(true);
    tx.onerror = () => rej(tx.error);
  }));
}
function idbGet(key){
  return openDb().then((d) => new Promise((res, rej) => {
    const tx = d.transaction(AUDIO_STORE, 'readonly');
    const rq = tx.objectStore(AUDIO_STORE).get(key);
    rq.onsuccess = () => res(rq.result || null);
    rq.onerror = () => rej(rq.error);
  }));
}
function idbDel(key){
  return openDb().then((d) => new Promise((res, rej) => {
    const tx = d.transaction(AUDIO_STORE, 'readwrite');
    tx.objectStore(AUDIO_STORE).delete(key);
    tx.oncomplete = () => res(true);
    tx.onerror = () => rej(tx.error);
  }));
}
function idbClear(){
  return openDb().then((d) => new Promise((res, rej) => {
    const tx = d.transaction(AUDIO_STORE, 'readwrite');
    tx.objectStore(AUDIO_STORE).clear();
    tx.oncomplete = () => res(true);
    tx.onerror = () => rej(tx.error);
  }));
}

function loadCacheIdx(){
  try{
    const j = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
    if(j && typeof j === 'object'){
      for(const k of Object.keys(j)){
        if(j[k] && typeof j[k].size === 'number') cacheIdx[k] = j[k];
      }
    }
  }catch(e){ cacheIdx = {}; }
}
function saveCacheIdx(){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify(cacheIdx)); }catch(e){}
}

function fmtBytes(n){
  n = n || 0;
  if(n >= 1073741824) return (n / 1073741824).toFixed(1) + ' GB';
  return (n / 1048576).toFixed(n > 10485760 ? 0 : 1) + ' MB';
}

function dlLabel(it){
  if(it.pending) return '—';
  if(/生成|失效/.test(it.error || '')) return '—';
  if(cacheIdx[it.id]) return '✓';
  const p = dlProgress[it.id];
  if(p) return p.total ? Math.round(p.got / p.total * 100) + '%' : '…';
  return '↓';
}

function refreshDl(id){
  const btn = document.querySelector('.item[data-id="' + id + '"] .dl');
  if(btn){
    const it = byId(id);
    btn.textContent = it ? dlLabel(it) : '↓';
    btn.classList.toggle('on', !!cacheIdx[id]);
  }
  updateCacheInfo();
}

function cacheStats(){
  const ids = Object.keys(cacheIdx);
  let bytes = 0;
  for(const id of ids) bytes += (cacheIdx[id] && cacheIdx[id].size) || 0;
  return { n: ids.length, bytes };
}

function updateCacheInfo(){
  const bar = $('cacheBar');
  if(!bar) return;
  const s = cacheStats();
  bar.hidden = items.length === 0;
  const info = $('cacheInfo');
  const total = items.filter((x) => !x.pending).length;
  if(info) info.textContent = '已存 ' + s.n + '/' + total + ' 集 · ' + fmtBytes(s.bytes);
}

async function downloadOne(it){
  if(!it || !it.ok || !it.audio) throw new Error('没有音频地址');
  if(cacheIdx[it.id]) return 0;
  if(dlProgress[it.id]) throw new Error('正在下载中');
  if(expired(it)) throw new Error('地址过期了，先刷新清单');

  dlProgress[it.id] = { got: 0, total: 0 };
  refreshDl(it.id);

  try{
    const res = await fetch(it.audio);
    if(!res.ok) throw new Error('HTTP ' + res.status);

    const total = +res.headers.get('content-length') || 0;
    dlProgress[it.id].total = total;

    const reader = res.body.getReader();
    const chunks = [];
    let got = 0;
    while(true){
      const step = await reader.read();
      if(step.done) break;
      chunks.push(step.value);
      got += step.value.length;
      dlProgress[it.id].got = got;
      refreshDl(it.id);
    }

    const blob = new Blob(chunks, { type: res.headers.get('content-type') || 'audio/mpeg' });
    await idbPut(it.id, blob);
    cacheIdx[it.id] = { size: blob.size, savedAt: Date.now() };
    saveCacheIdx();
    return blob.size;
  } finally {
    delete dlProgress[it.id];
    refreshDl(it.id);
  }
}

async function toggleDownload(it){
  if(it.pending){ toast('这一集还没填链接'); return; }
  if(cacheIdx[it.id]) return deleteCached(it);
  if(dlProgress[it.id]) return;

  try{
    if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    toast('开始缓存…');
    const size = await downloadOne(it);
    toast('已存到手机 · ' + fmtBytes(size));
  }catch(err){
    console.warn('[cache]', err);
    toast('缓存失败：' + err.message);
  }
}

async function deleteCached(it){
  const s = cacheIdx[it.id];
  const k = await openSheet('删除本地缓存？', [
    { key: '__ok', label: '删除 ' + fmtBytes(s ? s.size : 0) }
  ]);
  if(k !== '__ok') return;
  try{ await idbDel(it.id); }catch(e){}
  delete cacheIdx[it.id];
  saveCacheIdx();
  refreshDl(it.id);
  toast('已删除');
}

async function cacheAll(){
  // 只缓存当前显示出来的（搜索结果或当前专辑），不是整个库
  const src = queue.length ? queue : items;
  const todo = src.filter((x) => x.ok && x.audio && !cacheIdx[x.id] && !expired(x));
  if(!src.length){ toast('当前列表是空的'); return; }
  if(!todo.length){ toast('这些都缓存好了'); return; }

  let ok = 0, fail = 0;
  for(let i = 0; i < todo.length; i++){
    toast('缓存 ' + (i + 1) + '/' + todo.length + '…');
    try{
      await downloadOne(todo[i]);
      ok++;
    }catch(err){
      fail++;
      console.warn('[cache]', todo[i].title, err);
    }
    updateCacheInfo();
  }
  toast('完成：成功 ' + ok + (fail ? '，失败 ' + fail : ''));
}

async function clearAll(){
  const s = cacheStats();
  if(!s.n){ toast('还没有缓存'); return; }
  const k = await openSheet('清空本地缓存？', [
    { key: '__ok', label: '删除全部 ' + fmtBytes(s.bytes) }
  ]);
  if(k !== '__ok') return;
  try{ await idbClear(); }catch(e){}
  cacheIdx = {};
  saveCacheIdx();
  renderList();
  toast('已清空');
}

async function resolveSrc(it){
  if(cacheIdx[it.id]){
    try{
      const blob = await idbGet(it.id);
      if(blob){
        if(curUrl) URL.revokeObjectURL(curUrl);
        curUrl = URL.createObjectURL(blob);
        curFromCache = true;
        return curUrl;
      }
    }catch(e){
      console.warn('[cache] 读取失败，改走网络', e);
    }
  }
  curFromCache = false;
  return it.audio;
}

/* ---------- GitHub 模式（部署在 GitHub Pages 时，替你把链接提交进仓库） ---------- */
const GH_KEY = 'podcast.v2.gh';
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

let GH = null;
let devOk = false;

function loadGH(){
  try{
    const j = JSON.parse(localStorage.getItem(GH_KEY) || 'null');
    if(j && j.owner && j.repo && j.token) GH = j;
  }catch(e){ GH = null; }
}
function saveGH(){
  try{
    if(GH) localStorage.setItem(GH_KEY, JSON.stringify(GH));
    else localStorage.removeItem(GH_KEY);
  }catch(e){}
}

function guessRepo(){
  const host = location.hostname;
  if(!/\.github\.io$/.test(host)) return null;
  const owner = host.replace(/\.github\.io$/, '');
  const first = location.pathname.split('/').filter(Boolean)[0];
  return { owner, repo: first || owner + '.github.io' };
}

function tokenFromUrl(link){
  try{
    const u = new URL(link);
    const m = u.pathname.match(/\/podcast\/([A-Za-z0-9_-]{6,})/);
    if(m) return m[1];
    const q = u.searchParams.get('token') || u.searchParams.get('share_token');
    if(q && /^[A-Za-z0-9_-]{6,}$/.test(q)) return q;
  }catch(e){}
  return '';
}

function b64encode(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for(let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64decode(b64){
  const bin = atob(String(b64 || '').replace(/\s+/g, ''));
  const bytes = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

async function ghApi(path, opts){
  opts = opts || {};
  const token = opts.token || (GH && GH.token) || '';
  const res = await fetch('https://api.github.com' + path, {
    method: opts.method || 'GET',
    headers: Object.assign(
      {
        'Accept': 'application/vnd.github+json',
        'Authorization': 'Bearer ' + token,
        'X-GitHub-Api-Version': '2022-11-28'
      },
      opts.body ? { 'Content-Type': 'application/json' } : {}
    ),
    body: opts.body
  });
  let j = {};
  try{ j = await res.json(); }catch(e){}
  if(!res.ok){
    const err = new Error(j.message || ('HTTP ' + res.status));
    err.status = res.status;
    throw err;
  }
  return j;
}

async function connectGh(token, g){
  const info = await ghApi('/repos/' + g.owner + '/' + g.repo, { token });
  if(info.permissions && info.permissions.push === false){
    throw new Error('这个令牌没有写入权限');
  }
  GH = { owner: g.owner, repo: g.repo, branch: info.default_branch || 'main', token };
  saveGH();
  return GH;
}

async function ghAddLink(v, token){
  const path = '/repos/' + GH.owner + '/' + GH.repo + '/contents/links.txt';
  const cur = await ghApi(path + '?ref=' + encodeURIComponent(GH.branch));
  const text = b64decode(cur.content);
  if(text.indexOf(token) >= 0) throw new Error('这个链接已经在清单里了');

  const line = (v.album ? v.album + ' | ' : '') + v.url;
  const next = line + '\n' + text;

  await ghApi(path, {
    method: 'PUT',
    body: JSON.stringify({
      message: 'add: ' + (v.album || '播客') + ' · ' + token.slice(0, 8),
      content: b64encode(next),
      sha: cur.sha,
      branch: GH.branch
    })
  });
}

function ghErr(err){
  if(err.status === 401){ GH = null; saveGH(); toast('令牌无效或过期，重新连接一下'); }
  else if(err.status === 403) toast('权限不够：令牌要给这个仓库 Contents 的 Read and write');
  else if(err.status === 404) toast('找不到仓库或 links.txt');
  else if(err.status === 409) toast('文件刚被改过，再点一次');
  else toast('失败：' + err.message);
}

function waitForItem(id, onTick){
  const started = Date.now();
  return new Promise((resolve) => {
    const tick = async () => {
      await sleep(4000);
      try{
        const r = await fetch('./library.json?t=' + Date.now(), { cache: 'no-store' });
        if(r.ok){
          const j = await r.json();
          if((j.items || []).some((x) => x.id === id)) return resolve(j);
        }
      }catch(e){}
      const sec = Math.round((Date.now() - started) / 1000);
      if(onTick) onTick(sec);
      if(Date.now() - started > 180000) return resolve(null);
      setTimeout(tick, 2000);
    };
    setTimeout(tick, 3000);
  });
}

async function connectFlow(){
  if(location.protocol === 'file:'){
    explainMode();
    return false;
  }
  const g = guessRepo();
  if(!g){
    explainMode();
    return false;
  }

  const token = await openConnectSheet(g);
  if(!token) return false;

  toast('正在验证令牌…');
  try{
    await connectGh(token, g);
    toast('已连接，再贴一次链接就行');
    return true;
  }catch(err){
    if(err.status === 401) toast('令牌不对，检查有没有复制完整');
    else toast('连接失败：' + err.message);
    return false;
  }
}

async function addLocal(){
  const v = await openAddSheet();
  if(!v || !v.url) return;

  toast('正在换地址…');
  try{
    const res = await fetch('./api/resolve', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(v)
    });
    if(res.status === 404 || res.status === 405){ toast('这个地址不支持直接添加，请改 links.txt'); return; }
    const j = await res.json().catch(() => ({}));
    if(!res.ok || j.error){ toast(j.error || ('添加失败 HTTP ' + res.status)); return; }
    await loadLib(true);
    toast('已添加');
    if(j.item && j.item.id) play(j.item.id);
  }catch(err){
    toast('连不上本地服务：先运行 bun dev-server.mjs');
  }
}

async function addRemote(){
  const v = await openAddSheet();
  if(!v) return;

  if(v.disconnect){
    const k = await openSheet('断开 GitHub？', [{ key: '__ok', label: '确认断开' }]);
    if(k === '__ok'){ GH = null; saveGH(); toast('已断开'); }
    return;
  }
  if(!v.url) return;

  const token = tokenFromUrl(v.url);
  if(!token){ toast('认不出这个链接，要豆包播客分享链接'); return; }

  toast('正在提交到 GitHub…');
  try{ await ghAddLink(v, token); }
  catch(err){ ghErr(err); return; }

  toast('已提交，等 Actions 换地址…');
  const j = await waitForItem(token, (sec) => toast('Actions 运行中… ' + sec + ' 秒'));
  if(!j){ toast('已提交，但 3 分钟没等到更新。点 ↻ 再试，或去 Actions 看看'); return; }

  await loadLib(true);
  toast('已添加');
  play(token);
}

  try{ $('searchInput').focus(); }catch(e){}
});
$('searchInput').addEventListener('input', (e) => {
  searchQuery = e.target.value;
  renderList();
});
$('searchInput').addEventListener('keydown', (e) => {
  if(e.key === 'Escape') closeSearch();
  if(e.key === 'Enter') e.target.blur();
});

$('btnAdd').addEventListener('click', async () => {
  if(devOk) return addLocal();
  if(!GH){
    const ok = await connectFlow();
    if(!ok) return;
  }
  return addRemote();
});
$('btnClose').addEventListener('click', back);
$('btnMore').addEventListener('click', async () => {
  const it = current();
  if(!it) return;

  const opts = [];
  if(it.text) opts.push({ key: 'text', label: '查看文稿' });
  if(it.link) opts.push({ key: 'open', label: '在豆包打开原页面' });
  if(it.audio) opts.push({ key: 'copy', label: '复制音频地址' });
  if(!opts.length) return;

  const k = await openSheet(splitTitle(it.title).text, opts);

  if(k === 'text') openTextSheet(splitTitle(it.title).text, it.text);
  if(k === 'open' && it.link) window.open(it.link, '_blank', 'noopener');
  if(k === 'copy'){
    try{
      await navigator.clipboard.writeText(new URL(it.audio, location.href).href);
      toast(it.self ? '已复制' : '已复制（地址会过期）');
    }catch(e){ toast('复制失败'); }
  }
});
$('btnText').addEventListener('click', () => {
  const it = current();
  if(!it || !it.text) return;
  openTextSheet(splitTitle(it.title).text, it.text);
});
$('btnSource').addEventListener('click', () => {
  const it = current();
  if(it && it.link) window.open(it.link, '_blank', 'noopener');
  else toast('没有原页面地址');
});

$('btnPlay').addEventListener('click', () => {
  const it = current();
  if(!it){ toast('先从列表里选一集'); return; }
  if(au.paused) au.play().catch(() => toast('播放失败'));
  else au.pause();
});
$('mPlay').addEventListener('click', (e) => {
  e.stopPropagation();
  if(au.paused) au.play().catch(() => {});
  else au.pause();
});
$('mOpen').addEventListener('click', () => go('player'));
$('btnPrev').addEventListener('click', prev);
$('btnNext').addEventListener('click', () => next(false));
$('btnBack15').addEventListener('click', () => { au.currentTime = Math.max(0, au.currentTime - 15); });
$('btnFwd15').addEventListener('click', () => { au.currentTime = Math.min(au.duration || 0, au.currentTime + 15); });
$('btnRate').addEventListener('click', cycleRate);

$('seek').addEventListener('pointerdown', () => { scrub = true; });
$('seek').addEventListener('input', (e) => {
  scrub = true;
  const it = current();
  const d = au.duration || (it ? it.duration : 0) || 0;
  const v = +e.target.value / 1000 * d;
  $('tCur').textContent = fmt(v);
  e.target.style.setProperty('--pct', (v / (d || 1) * 100) + '%');
});
$('seek').addEventListener('change', (e) => {
  const it = current();
  const d = au.duration || (it ? it.duration : 0) || 0;
  if(d){ try{ au.currentTime = +e.target.value / 1000 * d; }catch(err){} }
  scrub = false;
});

addEventListener('pagehide', () => saveProgress(true));
document.addEventListener('visibilitychange', () => { if(document.hidden) saveProgress(true); });
addEventListener('keydown', (e) => {
  if(e.target && /^(INPUT|TEXTAREA|BUTTON)$/.test(e.target.tagName)) return;
  if(e.key === '/'){ e.preventDefault(); openSearch(); return; }
  if(e.code === 'Space'){ e.preventDefault(); if(au.paused) au.play().catch(() => {}); else au.pause(); }
  if(e.code === 'ArrowLeft'){ au.currentTime = Math.max(0, au.currentTime - 15); }
  if(e.code === 'ArrowRight'){ au.currentTime = Math.min(au.duration || 0, au.currentTime + 15); }
});

/* ---------- 启动 ---------- */
loadLocal();
loadCacheIdx();
loadGH();
initMedia();
try{ history.replaceState({ v: 'list' }, ''); }catch(e){}
show('list');
loadLib(false);
detectDev();

const secure = location.protocol === 'https:' ||
  location.hostname === 'localhost' || location.hostname === '127.0.0.1';
if('serviceWorker' in navigator && secure){
  navigator.serviceWorker.register('./sw.js').catch((e) => console.warn('[sw]', e));
}

window.__podcast = {
  get lib(){ return LIB; },
  get items(){ return items; },
  get state(){ return { curId, rate, prog, qIndex, queueLen: queue.length }; },
  get gh(){ return GH ? { owner: GH.owner, repo: GH.repo, branch: GH.branch, hasToken: !!GH.token } : null; },
  get dev(){ return devOk; },
  reload: () => loadLib(true),
  connectGh,
  ghAddLink,
  tokenFromUrl,
  b64encode,
  b64decode,
  guessRepo,
  version: '1.2.0'
};

})();
</script>
</body>
</html>
